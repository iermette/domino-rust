[workspace]
resolver = "2"
members = ["crates/domino-core", "crates/domino-server"]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
domino-core = { path = "crates/domino-core" }
tokio = { version = "1.53", features = ["rt-multi-thread", "net", "macros", "time", "sync"] }
tokio-tungstenite = "0.26"
futures-util = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.9"
clap = { version = "4.6", features = ["derive"] }

[profile.dev]
opt-level = 1
